<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italy Job & Work Finder Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 min-h-screen text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

    <div class="max-w-6xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="text-center mb-12">
            <span class="px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full text-xs font-semibold tracking-wider uppercase mb-3 inline-block">Italy Opportunity Hub</span>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-white mb-3">Job & Work Finder</h1>
            <p class="text-slate-400 max-w-lg mx-auto text-sm md:text-base">Search all real vacancies across Italy. Smart English-to-Italian multi-keyword matching included.</p>
        </header>

        <!-- Search & Filter Control Center -->
        <div class="bg-slate-800/60 backdrop-blur-xl p-4 md:p-6 rounded-3xl shadow-2xl border border-slate-700/60 mb-10 grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
            
            <!-- Keyword Search with Expanded Mapping -->
            <div class="md:col-span-5 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search in English (e.g. welder, driver, chef)..." 
                    class="w-full pl-11 pr-4 py-3.5 bg-slate-900/80 border border-slate-700 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200 placeholder-slate-500 text-sm transition"
                >
            </div>
            
            <!-- All Italy Regions & Cities Filter -->
            <div class="md:col-span-3">
                <select id="locationSelect" class="w-full px-4 py-3.5 bg-slate-900/80 border border-slate-700 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200 text-sm transition">
                    <option value="r=&ci=&to=">🇮🇹 All Italy (Nationwide)</option>
                    <optgroup label="Regions & Cities">
                        <option value="r=4&ci=&to=">Lombardia (Region)</option>
                        <option value="r=12&ci=&to=">Lazio (Region)</option>
                        <option value="r=1&ci=&to=">Piemonte (Region)</option>
                        <option value="r=8&ci=&to=">Emilia-Romagna (Region)</option>
                        <option value="r=16&ci=&to=">Toscana (Region)</option>
                        <option value="r=4&ci=8&to=">Milano (City)</option>
                        <option value="r=12&ci=4&to=">Roma (City)</option>
                        <option value="r=1&ci=13&to=">Torino (City)</option>
                        <option value="r=8&ci=38&to=">Bologna (City)</option>
                        <option value="r=16&ci=117&to=">Firenze (City)</option>
                        <option value="r=15&ci=62&to=">Napoli (City)</option>
                        <option value="r=9&ci=59&to=">Genova (City)</option>
                        <option value="r=3&ci=91&to=">Venezia (City)</option>
                    </optgroup>
                </select>
            </div>

            <!-- Date Sort Filter -->
            <div class="md:col-span-2">
                <select id="dateSort" class="w-full px-4 py-3.5 bg-slate-900/80 border border-slate-700 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200 text-sm transition">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>

            <!-- Search Action Button -->
            <div class="md:col-span-2">
                <button 
                    onclick="fetchJobs()" 
                    class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-600/30 transition duration-200 text-sm flex items-center justify-center gap-2"
                >
                    <span>Search</span>
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center py-20">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent"></div>
            <p class="text-slate-400 mt-3 text-sm font-medium">Scanning all real live vacancies across Italy...</p>
        </div>

        <!-- Results Grid -->
        <div id="jobList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cards -->
        </div>
    </div>

    <script>
        const API_URL = "https://subito-custom-api.onrender.com/api/ads";
        const API_KEY = "subito_secret_key_2026";

        // Expanded Keyword Map covering all major job fields in English mapped to rich Italian job terms
        const keywordMap = {
            "welder": "saldatore tig mig carpentiere",
            "metal": "carpentiere metallo saldatore",
            "fabrication": "carpenteria metallica",
            "driver": "autista corriere magazziniere",
            "cook": "cuoco chef pizzeria",
            "chef": "chef cuoco",
            "waiter": "cameriere sala bar",
            "cleaner": "pulizie addetto pulizie colf",
            "mechanic": "meccanico auto officina",
            "electrician": "elettricista impianti",
            "plumber": "idraulico termoidraulico",
            "carpenter": "falegname legno",
            "warehouse": "magazziniere mulettista logistica",
            "delivery": "fattorino corriere rider",
            "nurse": "infermiere oss socio",
            "painter": "verniciatore imbianchino",
            "builder": "muratore edile cantiere",
            "security": "addetto sicurezza portiere guardiano"
        };

        async function fetchJobs() {
            let rawQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            const locationParams = document.getElementById('locationSelect').value;
            const sortOrder = document.getElementById('dateSort').value;
            const jobList = document.getElementById('jobList');
            const loading = document.getElementById('loading');

            // Map English keyword to broader Italian search terms if available
            let translatedQuery = rawQuery;
            if (keywordMap[rawQuery]) {
                translatedQuery = keywordMap[rawQuery];
            }

            jobList.innerHTML = "";
            loading.classList.remove('hidden');

            try {
                const targetUrl = `${API_URL}?api_key=${API_KEY}&c=26&${locationParams}&q=${encodeURIComponent(translatedQuery)}`;
                
                const response = await fetch(targetUrl);
                const data = await response.json();

                loading.classList.add('hidden');

                if (!data.success || !data.items || data.items.length === 0) {
                    jobList.innerHTML = `
                        <div class="col-span-full text-center py-16 bg-slate-800/40 border border-slate-700/50 rounded-3xl">
                            <p class="text-slate-400 text-base">No real vacancies found matching your search. Try a different keyword or region.</p>
                        </div>`;
                    return;
                }

                let items = data.items;
                items.sort((a, b) => {
                    let dateA = new Date(a.date || 0);
                    let dateB = new Date(b.date || 0);
                    return sortOrder === 'newest' ? dateB - dateA : dateA - dateB;
                });

                items.forEach(job => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-800/50 backdrop-blur-md rounded-3xl border border-slate-700/60 p-6 shadow-xl hover:border-indigo-500/50 transition duration-300 flex flex-col justify-between group";
                    
                    const displayPrice = (job.price && job.price !== "N/A" && job.price.trim() !== "") 
                        ? job.price 
                        : "No price suggested";

                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-4">
                                <span class="text-xs font-medium px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full">
                                    ${job.location.city || job.location.region || 'Italy'}
                                </span>
                                <span class="text-sm font-bold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
                                    ${displayPrice}
                                </span>
                            </div>
                            <h3 class="font-bold text-lg text-white mb-2 group-hover:text-indigo-400 transition line-clamp-2">${job.title}</h3>
                            <p class="text-slate-400 text-xs mb-2 text-slate-500">${job.date || 'Recent'}</p>
                            <p class="text-slate-300 text-sm line-clamp-3 mb-6 leading-relaxed">${job.description || 'No description provided.'}</p>
                        </div>
                        <div>
                            <a href="${job.url}" target="_blank" class="flex items-center justify-center w-full py-3 bg-slate-700/60 hover:bg-indigo-600 text-white rounded-2xl font-medium text-sm transition duration-200 border border-slate-600/50 group-hover:border-indigo-500">
                                View Original Ad ➔
                            </a>
                        </div>
                    `;
                    jobList.appendChild(card);
                });

            } catch (error) {
                loading.classList.add('hidden');
                jobList.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-red-500/10 border border-red-500/20 rounded-3xl">
                        <p class="text-red-400 text-sm">Failed to load data. Please check connection.</p>
                    </div>`;
            }
        }

        window.onload = fetchJobs;
    </script>
</body>
</html>
